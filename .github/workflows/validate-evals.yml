name: Schema & Data Contract Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install jsonschema

      - name: Validate JSON Schemas and Sample Data Contracts
        run: |
          python - << 'EOF'
          import json, jsonschema

          for kind in ["corpus", "qa", "labels"]:
              with open(f"schemas/{kind}.schema.json") as f:
                  schema = json.load(f)
              with open(f"samples/D01_sample_{kind}.jsonl") as f:
                  for i, line in enumerate(f):
                      record = json.loads(line)
                      jsonschema.validate(instance=record, schema=schema)
              print(f"Verified samples/D01_sample_{kind}.jsonl matches schema.")
          EOF
